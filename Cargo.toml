[package]
name    = "localsend-cli"
version = "0.0.8"
edition = "2024"

[dependencies]
infer        = "0.22.0"
mime_guess   = "2.0.5"
miniserde    = "0.1.45"
rs-machineid = "0.2.0"
rune-sha256  = "0.1.1"
tiny_http    = "0.12.0"
ureq         = "3.4.0"
zfish        = "0.1.10"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
