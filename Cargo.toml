[package]
name    = "localsend-cli"
version = "1.0.3"
edition = "2024"

[dependencies]
hex = { version = "0.4.3", default-features = false }
infer = { version = "0.22.0", default-features = false, features = ["std"] }
mime_guess = { version = "2.0.5", default-features = false }
miniserde = { version = "0.1.45", default-features = false, features = ["std"] }
rs-machineid = "0.2.0"
sha2 = { version = "0.11.0", default-features = false }
smol = { version = "2.0.2", default-features = false }
smol-timeout = { version = "0.6.1", default-features = false }
thiserror_lite = "0.1.0"
tiny_http = "0.12.0"
zfish = { version = "0.1.10", default-features = false, features = [
  "interactive",
  "progress",
] }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
